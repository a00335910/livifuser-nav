camera_intrinsics: config/calibration/rpi_camera_v3_320x240_2026-07-29.yaml
checkerboard:
  columns: 8
  rows: 6
  square_size_m: 0.025

# Angles use the normalized LDS-03 convention: zero is forward and positive is left.
# Each interval selects only the planar checkerboard/cardboard face, excluding box sides.
poses:
