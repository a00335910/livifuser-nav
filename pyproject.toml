[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livifuser-nav"
version = "0.1.0"
description = "Infrastructure and learning stack for LiViFuser-Nav"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "LiViFuser-Nav Team" }]
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.22",
    "pillow>=11.0",
    "torch>=2.7,<3",
]

[project.scripts]
livifuser-stage1-check = "livifuser_nav.stage1_check:main"

[dependency-groups]
dev = [
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/livifuser_nav"]

[tool.ruff]
line-length = 100
target-version = "py310"
# build/, install/, log/ are colcon products. notebooks/*.ipynb are generated by
# scripts/build_kaggle_*.py; their cell structure (sys.path bootstrap before imports,
# embedded payload literals) is inherent to the generated form, not hand-written style.
extend-exclude = [
    "build",
    "install",
    "log",
    "ros2_ws/build",
    "ros2_ws/install",
    "notebooks/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

